gateway:
  https_mode:
    enabled: true
    k8s_api_gateway:
      name: gcp-globalyapp-external ##### -gw (chart le automatic add garcha)
      #### final => name: globalyapp-external-gw
      gatewayClassName: gke-l7-global-external-managed
      listener_http_namespaces: "Same"      # Shared for both HTTP/HTTPS
      listener_https_namespaces: "Same"     # separate HTTPS value
    tls:
      enabled: false
      mode: Terminate
      certificateRefs:
        - name: globalyapp-tls-secret
          kind: Secret
      
      
