consumer:
  name: consumer-globlay-os-default
  replicaCount: 1

  image:
    repository: 834033184010.dkr.ecr.ap-southeast-2.amazonaws.com/globalyos-backend
    tag: globalyos-backend-04-30-415360a
    pullPolicy: IfNotPresent

  imagePullSecrets:
    enabled: false
    name: ecr-registry-secret

  securityContext:
    enabled: false
    runAsUser: 0       # UID the container process runs as
    runAsGroup: 0      # Primary GID of the container process
    supplementalGroupsAndFsGroup:
      enabled: false
      supplementalGroups: [4000]
      fsGroup: 2000

  tolerations:
    enabled: true                  
    unreachableSeconds: 60         
    notReadySeconds: 60   

  startupCommand:
    enabled: true
    shell: /bin/bash
    command: |
      echo "-------------------------------"
      echo "k8s => restarting supervisor"
      echo "-------------------------------"
      sudo service supervisor start
      echo "k8s => starting queue"
      echo "-------------------------------"      
      tail -f /dev/null
      
  resources:
    requests:
      memory: "500Mi"
    limits:
      memory: "800Mi"
  multiplePorts:
    enabled: false
    ports:
      - port: 9000
        name: http
  livenessProbe:
    enabled: false
    httpGet:
      path: /api/v2/health
      port: 80
    initialDelaySeconds: 20
    periodSeconds: 60
    failureThreshold: 3
  readinessProbe:
    enabled: false
    httpGet:
      path: /nginx-health
      port: 80
    initialDelaySeconds: 15
    periodSeconds: 60
    failureThreshold: 3
  startupProbe:
    enabled: false
    httpGet:
      path: /nginx-health
      port: 80
    initialDelaySeconds: 15
    periodSeconds: 60
    failureThreshold: 3 

  volumes:
    defaultpvc:
      enabled: false
      volumeName: "logs-storage"
      pvcName: "pvc-agentcisapp-queue-consumer"
      containerMountPath: "/home/agentcis/storage/logs/"
      subPath:
        enabled: false      
        hostSubPath: "consumer-globalyos-default/"

  affinity:
    enabled: false
    preferredNodes:
      - hostname: agentcis-staging-k8s-master-172-34-28-189
        weight: 100
      - hostname: other-server
        weight: 50

  service:
    enabled: false
    type: NodePort
    containerport: 80
    svcport: 29000

  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    cpuUtilization: 50
    scaleUp:
      podsValue: 2
    scaleDown:
      podsValue: 1

  ingress:
    enabled: false
    clusterIssuer: lets-encrypt
    className: nginx
    host: subash.globalyhub.com
    path: /
  httproute:
    enabled: false
    gateway:
      name: "agentcisapp-stage-alb-gateway"
      namespace: "gateways-globalyos"
      sectionName: "https"
    customHostname:
      enabled: false
      hosts:
        - "*.staging.agentcis.com"       
    httpMultipleRoute:
      paths:
        - /
    urlRewriteEnabled: false
  targetGroupConfiguration:
    enabled: false
    targetType: "instance"
    healthCheckPath: "/agent-portal"
    healthCheckProtocol: "HTTP"
    healthCheckPort: "80"
    healthCheckInterval: 5
    healthCheckTimeout: 4      # ← ADD THIS LINE
    healthyThresholdCount: 2
    unhealthyThresholdCount: 2
    matcher:
      httpCode: "200-399,401-404"
