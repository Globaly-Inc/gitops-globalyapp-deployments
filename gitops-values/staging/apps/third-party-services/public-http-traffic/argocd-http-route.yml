### Attaches a GCP HealthCheckPolicy + Gateway HTTPRoute to the already-running
### argocd-server Service (bootstrapped separately in the argocd namespace)
### so it's reachable through the shared gateway in apps/staging/public-traffic/gcp/gcp-gw-globalyos-parent.yml
microservice:
  name: argocd-server #exact name of service
  service:
    svcport: 80
  gcphttproute:
    enabled: true
    urlRewriteEnabled: false
    gateway:
      name: "gcp-globalyapp-external-gw"
      namespace: "gateways-globalyapp"
      sectionName: ""
    customHostname:
      enabled: true
      hosts:
        - "deploystaging.globalyapp.com"
    httpMultipleRoute:
      paths:
        - "/"
    weight: 1
  gcpHealthcheck:
    enabled: true
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
    port: 8080
    requestPath: "/"
